<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="WeKnow">
  <!-- WeKnow mark: an eye whose lower lid is a tick. One stroke and one dot.
       Deep green on light surfaces, mint on dark ones. -->
  <style>
    .m { stroke: #075C3D; } .p { fill: #075C3D; }
    @media (prefers-color-scheme: dark) { .m { stroke: #3ECF92; } .p { fill: #3ECF92; } }
  </style>
  <path class="m" d="M222 452 A330 330 0 0 1 802 420 L436 752 L272 600" fill="none" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="p" cx="500" cy="486" r="92"/>
</svg>
